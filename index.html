<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Börsenampel v2.0 - Twelve Data</title>
    <meta name="description" content="Täglicher Markt-Check mit Ampel-System">
    <link rel="manifest" href="/manifest.json">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: #1e293b;
            color: #e2e8f0;
            min-height: 100vh;
            padding: 20px;
        }
        .container { max-width: 1200px; margin: 0 auto; }
        h1 { font-size: 1.8rem; margin-bottom: 10px; }
        h2 { font-size: 1.3rem; margin-bottom: 15px; color: #94a3b8; }
        h3 { font-size: 1.1rem; margin-bottom: 10px; }
        .card {
            background: #334155;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; }
        .ampel-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
        }
        .ampel {
            width: 80px;
            height: 200px;
            background: #475569;
            border-radius: 10px;
            position: relative;
            box-shadow: 0 0 20px rgba(0,0,0,0.3);
        }
        .ampel-light {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            margin: 10px auto;
            transition: all 0.3s ease;
        }
        .ampel-rot { background: #ef4444; box-shadow: 0 0 20px #ef4444; }
        .ampel-gelb { background: #f59e0b; box-shadow: 0 0 20px #f59e0b; }
        .ampel-gruen { background: #22c55e; box-shadow: 0 0 20px #22c55e; }
        .ampel-off { background: #475569; opacity: 0.5; }
        .pulse { animation: pulse 2s infinite; }
        @keyframes pulse { 0%, 100% { opacity: 0.6; } 50% { opacity: 1; } }
        .price { font-size: 2rem; font-weight: bold; }
        .price-change { font-size: 1rem; }
        .change-positive { color: #22c55e; }
        .change-negative { color: #ef4444; }
        .btn {
            background: #3b82f6;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1rem;
            transition: background 0.2s;
        }
        .btn:hover { background: #2563eb; }
        .btn:active { background: #1d4ed8; }
        .status-open { color: #22c55e; }
        .status-closed { color: #ef4444; }
        .status-weekend { color: #f59e0b; }
        .settings-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; }
        .settings-input { 
            background: #475569; 
            border: 1px solid #64748b; 
            color: #e2e8f0; 
            padding: 8px 12px; 
            border-radius: 6px;
            width: 100%;
        }
        .version-badge {
            background: #3b82f6;
            color: white;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 0.8rem;
            margin-left: 10px;
        }
        @media (max-width: 768px) {
            .grid { grid-template-columns: 1fr; }
            .settings-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <header class="text-center mb-6">
            <h1>📈 Börsenampel <span class="version-badge">v2.0 - Twelve Data</span></h1>
            <p class="text-sm" id="lastUpdate">Letzte Aktualisierung: -</p>
        </header>

        <!-- Ampel -->
        <div class="card">
            <h2>🚦 Marktstimmung</h2>
            <div class="ampel-container">
                <div class="ampel">
                    <div id="ampel-rot" class="ampel-light ampel-off"></div>
                    <div id="ampel-gelb" class="ampel-light ampel-off"></div>
                    <div id="ampel-gruen" class="ampel-light ampel-off"></div>
                </div>
                <div>
                    <div id="ampel-text" class="price">Lädt...</div>
                    <p id="ampel-reason" style="color: #94a3b8; font-size: 0.9rem; margin-top: 5px;">Warte auf Daten...</p>
                </div>
            </div>
        </div>

        <!-- Daten Grid -->
        <div class="grid">
            <!-- S&P 500 -->
            <div class="card">
                <h3>S&P 500 <span style="font-size: 0.7rem; background: #3b82f6; padding: 2px 6px; border-radius: 4px;">SPY ETF</span></h3>
                <div class="price" id="spx-price">-</div>
                <div class="price-change" id="spx-change">-</div>
                <div style="color: #94a3b8; font-size: 0.85rem; margin-top: 8px;">
                    Vorher: <span id="spx-prev-close">-</span>
                </div>
            </div>

            <!-- VIX -->
            <div class="card">
                <h3>VIX <span style="font-size: 0.7rem; background: #a855f7; padding: 2px 6px; border-radius: 4px;">VIXY ETF</span></h3>
                <div class="price" id="vix-price">-</div>
                <div class="price-change" id="vix-change">-</div>
                <div style="color: #94a3b8; font-size: 0.85rem; margin-top: 8px;">
                    Vorher: <span id="vix-prev-close">-</span>
                </div>
            </div>

            <!-- Fear & Greed -->
            <div class="card">
                <h3>Fear & Greed Index <span style="font-size: 0.7rem; background: #f97316; padding: 2px 6px; border-radius: 4px;">CNN</span></h3>
                <div class="price" id="fng-value">-</div>
                <div style="font-size: 1.2rem; color: #e2e8f0;" id="fng-text">-</div>
                <div style="color: #94a3b8; font-size: 0.85rem; margin-top: 8px;">
                    Aktualisiert: <span id="fng-time">-</span>
                </div>
            </div>

            <!-- Marktstatus -->
            <div class="card">
                <h3>Marktstatus</h3>
                <div style="text-align: center; font-size: 3rem;" id="marktstatus-emoji">🕒</div>
                <div style="text-align: center; font-size: 1.2rem; margin: 10px 0;" id="marktstatus-text">Lädt...</div>
                <div style="text-align: center; color: #94a3b8; font-size: 0.9rem;" id="marktstatus-next">-</div>
            </div>
        </div>

        <!-- Aktualisierungs-Button -->
        <div style="text-align: center; margin: 20px 0;">
            <button onclick="loadAllData()" class="btn">🔄 Daten aktualisieren</button>
        </div>

        <!-- Schwellenwerte -->
        <div class="card">
            <h2>⚙️ Ampel-Schwellenwerte anpassen</h2>
            <div class="settings-grid">
                <div>
                    <label style="display: block; margin-bottom: 5px; font-size: 0.9rem;">VIX Grün (niedrig)</label>
                    <input type="number" id="vix-green" value="15" class="settings-input">
                </div>
                <div>
                    <label style="display: block; margin-bottom: 5px; font-size: 0.9rem;">VIX Gelb (mittel)</label>
                    <input type="number" id="vix-yellow" value="20" class="settings-input">
                </div>
                <div>
                    <label style="display: block; margin-bottom: 5px; font-size: 0.9rem;">Fear & Greed Grün (hoch)</label>
                    <input type="number" id="fng-green" value="70" class="settings-input">
                </div>
                <div>
                    <label style="display: block; margin-bottom: 5px; font-size: 0.9rem;">Fear & Greed Gelb (neutral)</label>
                    <input type="number" id="fng-yellow" value="40" class="settings-input">
                </div>
            </div>
            <div style="text-align: center; margin-top: 15px;">
                <button onclick="saveThresholds()" class="btn" style="background: #22c55e;">💾 Schwellenwerte speichern</button>
            </div>
        </div>
    </div>

    <!-- Service Worker Registration -->
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/sw.js').catch(err => console.log(err));
            });
        }
    </script>

    <script>
        // Worker URL
        const WORKER_URL = 'https://boersenampelproxyy.tobseil87.workers.dev/';
        const FNG_URL = 'https://api.alternative.me/fng/';

        // Standard-Schwellenwerte
        let thresholds = {
            vixGreen: 15,
            vixYellow: 20,
            fngGreen: 70,
            fngYellow: 40
        };

        // Lade gespeicherte Schwellenwerte
        function loadThresholds() {
            const saved = localStorage.getItem('boersenampelThresholds');
            if (saved) {
                thresholds = JSON.parse(saved);
                document.getElementById('vix-green').value = thresholds.vixGreen;
                document.getElementById('vix-yellow').value = thresholds.vixYellow;
                document.getElementById('fng-green').value = thresholds.fngGreen;
                document.getElementById('fng-yellow').value = thresholds.fngYellow;
            }
        }

        // Speichere Schwellenwerte
        function saveThresholds() {
            thresholds = {
                vixGreen: parseFloat(document.getElementById('vix-green').value) || 15,
                vixYellow: parseFloat(document.getElementById('vix-yellow').value) || 20,
                fngGreen: parseFloat(document.getElementById('fng-green').value) || 70,
                fngYellow: parseFloat(document.getElementById('fng-yellow').value) || 40
            };
            localStorage.setItem('boersenampelThresholds', JSON.stringify(thresholds));
            alert('Schwellenwerte gespeichert!');
            loadAllData();
        }

        // Lade Marktstatus
        function getMarktStatus() {
            const now = new Date();
            const marketOpenStart = 15; // 15:30 MEZ
            const marketOpenEnd = 22;   // 22:00 MEZ
            const currentHour = now.getHours();
            const currentMinute = now.getMinutes();
            const isWeekend = now.getDay() === 0 || now.getDay() === 6;

            let isOpen = false;
            let statusText = '';
            let emoji = '🕒';
            let cssClass = '';

            if (!isWeekend) {
                if ((currentHour > marketOpenStart || (currentHour === marketOpenStart && currentMinute >= 30)) &&
                    (currentHour < marketOpenEnd || (currentHour === marketOpenEnd && currentMinute <= 0))) {
                    isOpen = true;
                    statusText = 'Geöffnet';
                    emoji = '🟢';
                    cssClass = 'status-open';
                } else {
                    statusText = 'Geschlossen';
                    emoji = '🔴';
                    cssClass = 'status-closed';
                }
            } else {
                statusText = 'Wochenende';
                emoji = '📅';
                cssClass = 'status-weekend';
            }

            const nextOpen = !isOpen && !isWeekend ?
                (currentHour < marketOpenStart || (currentHour === marketOpenStart && currentMinute < 30)) ?
                `Öffnet heute um ${marketOpenStart}:30 MEZ` :
                `Öffnet morgen um ${marketOpenStart}:30 MEZ` :
                '';

            return { isOpen, text: statusText, emoji, nextOpen, cssClass };
        }

        // Lade Markt-Daten vom Worker
        async function loadMarketData() {
            try {
                const response = await fetch(WORKER_URL, { cache: 'no-store' });
                if (!response.ok) throw new Error(`Worker-Response: ${response.status}`);
                const data = await response.json();

                // SPY Daten
                if (data.sp500) {
                    const spx = data.sp500;
                    document.getElementById('spx-price').textContent = spx.price?.toFixed(2) || '-';
                    document.getElementById('spx-prev-close').textContent = spx.prevClose?.toFixed(2) || '-';

                    const change = spx.change || 0;
                    const changePct = spx.changePercent || 0;
                    const changeColor = change >= 0 ? 'change-positive' : 'change-negative';
                    document.getElementById('spx-change').innerHTML = `${change >= 0 ? '+' : ''}${change.toFixed(2)} (${changePct >= 0 ? '+' : ''}${changePct.toFixed(2)}%)`;
                    document.getElementById('spx-change').className = `price-change ${changeColor}`;
                }

                // VIXY Daten
                if (data.vix) {
                    const vix = data.vix;
                    document.getElementById('vix-price').textContent = vix.price?.toFixed(2) || '-';
                    document.getElementById('vix-prev-close').textContent = vix.prevClose?.toFixed(2) || '-';

                    const change = vix.change || 0;
                    const changePct = vix.changePercent || 0;
                    const changeColor = change >= 0 ? 'change-positive' : 'change-negative';
                    document.getElementById('vix-change').innerHTML = `${change >= 0 ? '+' : ''}${change.toFixed(2)} (${changePct >= 0 ? '+' : ''}${changePct.toFixed(2)}%)`;
                    document.getElementById('vix-change').className = `price-change ${changeColor}`;
                }

                // Aktualisierungszeit
                if (data.fetchedAt) {
                    const date = new Date(data.fetchedAt);
                    document.getElementById('lastUpdate').textContent = `Letzte Aktualisierung: ${date.toLocaleString('de-DE')}`;
                }

                return data;
            } catch (error) {
                console.error('Fehler Markt-Daten:', error);
                document.getElementById('spx-price').textContent = 'Fehler';
                document.getElementById('vix-price').textContent = 'Fehler';
                throw error;
            }
        }

        // Lade Fear & Greed
        async function loadFearGreed() {
            try {
                const response = await fetch(FNG_URL, { cache: 'no-store' });
                if (!response.ok) throw new Error(`FNG-Response: ${response.status}`);
                const data = await response.json();

                if (data.fng) {
                    const fng = data.fng;
                    document.getElementById('fng-value').textContent = fng.value;
                    document.getElementById('fng-text').textContent = fng.value_text;
                    const date = new Date(fng.timestamp * 1000);
                    document.getElementById('fng-time').textContent = date.toLocaleDateString('de-DE');
                    return fng.value;
                }
            } catch (error) {
                console.error('Fehler Fear & Greed:', error);
                document.getElementById('fng-value').textContent = 'Fehler';
                document.getElementById('fng-text').textContent = 'N/A';
                throw error;
            }
        }

        // Aktualisiere Ampel
        function updateAmpel(vixValue, fngValue) {
            // Reset
            document.getElementById('ampel-rot').className = 'ampel-light ampel-off';
            document.getElementById('ampel-gelb').className = 'ampel-light ampel-off';
            document.getElementById('ampel-gruen').className = 'ampel-light ampel-off';

            let color = '';
            let text = '';
            let reason = '';

            if (vixValue <= thresholds.vixGreen && fngValue >= thresholds.fngGreen) {
                color = 'gruen';
                text = '🟢 Kaufsignal';
                reason = 'VIX niedrig & Fear & Greed hoch';
            } else if (vixValue >= thresholds.vixYellow || fngValue <= thresholds.fngYellow) {
                color = 'rot';
                text = '🔴 Verkaufssignal';
                reason = vixValue >= thresholds.vixYellow ? 'VIX zu hoch' : 'Fear & Greed zu niedrig';
            } else {
                color = 'gelb';
                text = '🟡 Vorsicht';
                reason = 'Neutrale Marktstimmung';
            }

            document.getElementById(`ampel-${color}`).className = `ampel-light ampel-${color} pulse`;
            document.getElementById('ampel-text').textContent = text;
            document.getElementById('ampel-reason').textContent = reason;
        }

        // Lade alle Daten
        async function loadAllData() {
            try {
                // Marktstatus
                const status = getMarktStatus();
                document.getElementById('marktstatus-emoji').textContent = status.emoji;
                document.getElementById('marktstatus-text').textContent = status.text;
                document.getElementById('marktstatus-text').className = status.cssClass;
                document.getElementById('marktstatus-next').textContent = status.nextOpen;

                // Lade parallel
                const [marketData, fngValue] = await Promise.all([
                    loadMarketData(),
                    loadFearGreed()
                ]);

                // Ampel aktualisieren
                if (marketData.vix && marketData.vix.price && fngValue) {
                    updateAmpel(marketData.vix.price, fngValue);
                }

            } catch (error) {
                console.error('Fehler:', error);
                document.getElementById('ampel-text').textContent = '❌ Fehler';
                document.getElementById('ampel-reason').textContent = 'Daten konnten nicht geladen werden';
            }
        }

        // Initial laden
        document.addEventListener('DOMContentLoaded', () => {
            loadThresholds();
            loadAllData();
        });

        // Automatische Aktualisierung alle 5 Minuten
        setInterval(loadAllData, 5 * 60 * 1000);
    </script>

    </script>
</body>
</html>
